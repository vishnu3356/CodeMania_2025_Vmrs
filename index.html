<!DOCTYPE html>
<html lang="en">
<head>
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Resources</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
            width: 100%;
        }

        #map {
            height: 400px;
            width: 90%;
            margin: 20px auto;
        }

        #resources {
            width: 90%;
            margin-bottom: 2rem;
        }

        .resource {
            border: 1px solid #ccc;
            padding: 1rem;
            margin: 0.5rem 0;
            border-radius: 5px;
        }

        .rating {
            color: goldenrod;
        }
    </style>
</head>
<body>

<header>
    <h1>Nearby Resources</h1>
</header>

<div id="map">Map goes here</div>

<section id="resources">
    <div class="resource">
        <h2>Resource Name</h2>
        <p>Description of the resource.</p>
        <span class="rating">★★★★★</span>
        <div id="map" style="height: 400px; width: 100%;"></div>
    </div>
</section>

</body>
</html>
